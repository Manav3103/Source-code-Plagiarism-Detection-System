<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submit Feedback - Real-Time Plagiarism Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      body {
        background: #f3f6fb;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0; padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      form {
        background: #fff;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.1);
        max-width: 450px;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        color: #222;
        margin-bottom: 28px;
        font-weight: 700;
        font-size: 1.9rem;
        letter-spacing: 0.04em;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #444;
        font-size: 1rem;
      }
      textarea {
        width: 100%;
        padding: 15px 15px;
        border: 1.8px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1rem;
        resize: vertical;
        min-height: 120px;
        transition: border-color 0.3s ease;
      }
      textarea:focus {
        border-color: #3b82f6;
        outline: none;
      }
      button {
        display: block;
        width: 100%;
        background-color: #3b82f6;
        color: white;
        padding: 14px 0;
        border: none;
        border-radius: 30px;
        font-size: 1.15rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgb(59 130 246 / 0.4);
        transition: background-color 0.3s ease;
        margin-top: 20px;
      }
      button:hover {
        background-color: #2563eb;
        box-shadow: 0 6px 16px rgb(37 99 235 / 0.6);
      }
      .back-link {
        margin-top: 28px;
        text-align: center;
        font-weight: 600;
        font-size: 1rem;
        color: #3b82f6;
        text-decoration: none;
        display: inline-block;
        transition: color 0.3s ease;
      }
      .back-link:hover {
        color: #2563eb;
        text-decoration: underline;
      }
      @media (max-width: 500px) {
        body {
          padding: 20px 15px;
        }
        form {
          padding: 25px 20px;
        }
      }
    </style>
</head>
<body>
    <form method="POST" novalidate>
        <h1>Submit Feedback</h1>

        <label for="feedback">Feedback</label>
        <textarea id="feedback" name="feedback" placeholder="Write your feedback here..." required></textarea>

        <button type="submit">Submit</button>

        <a href="/" class="back-link">← Back to Dashboard</a>
    </form>
</body>
</html>
